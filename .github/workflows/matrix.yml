name: Full Multi-Platform Matrix

on:
  push:
  pull_request:
  schedule:
    - cron: '30 3 * * 0'
  workflow_dispatch:
    inputs:
      suite:
        description: Platform suite to run
        type: choice
        default: all
        options:
          - all
          - haiku
          - hurd
          - redox
          - reactos
          - cfarm
      utf8:
        description: Enable UTF-8 paths
        type: choice
        default: 'OFF'
        options:
          - 'OFF'
          - 'ON'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.suite || 'all' }}-${{ inputs.utf8 || 'default' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Native mode is the primary per-change matrix. The same full matrix
  # exercises UTF-8 automatically once a week, or on manual request.
  PROGPATH_UTF8_MODE: ${{ github.event_name == 'schedule' && 'ON' || inputs.utf8 || 'OFF' }}
  # debug mode 3 = print method activity and keep evaluating methods
  PROGPATH_DEBUG: 3

jobs:
  # 1. WINDOWS (x64)
  windows-suite:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all'
    name: Windows (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
      # os: [windows-2019, windows-2022]
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DPROGPATH_UTF8=${{ env.PROGPATH_UTF8_MODE }}
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        working-directory: build
        run: ctest -C Debug --output-on-failure --verbose

  # 2. MACOS
  macos-suite:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all'
    name: macOS (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DPROGPATH_UTF8=${{ env.PROGPATH_UTF8_MODE }}
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --verbose

  # 3. LINUX DISTROS (Docker-based)
  linux-distros:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all'
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            image: ubuntu:latest
            install: apt-get update -q && apt-get install -y cmake build-essential
          - name: Debian
            image: debian:stable
            install: apt-get update -q && apt-get install -y cmake build-essential
          - name: Fedora
            image: fedora:latest
            install: dnf install -y cmake gcc gcc-c++ make
          - name: openSUSE
            image: registry.opensuse.org/opensuse/distrobox-packaging:latest
            install: zypper install -y cmake gcc gcc-c++ make
          - name: Arch Linux
            image: archlinux:latest
            install: pacman -Sy --noconfirm cmake base-devel
          - name: Alpine
            image: alpine:latest
            install: apk add --no-cache cmake build-base
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: ${{ matrix.install }}
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DPROGPATH_UTF8=${{ env.PROGPATH_UTF8_MODE }}
      - name: Build
        run: cmake --build build
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --verbose

  # 4. BSD FAMILY (VM-based via vmactions)

  # FreeBSD without procfs: exercises sysctl(KERN_PROC_PATHNAME) and
  # other non-proc methods. procfs is intentionally NOT mounted.
  freebsd-noproc:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all'
    name: FreeBSD (sysctl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test in FreeBSD (no /proc)
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.0'
          usesh: true
          envs: PROGPATH_DEBUG
          copyback: false
          prepare: |
            pkg install -y cmake gmake
          run: |
            cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_MAKE_PROGRAM=gmake -DPROGPATH_UTF8=${{ env.PROGPATH_UTF8_MODE }}
            cmake --build build
            cd build && ctest --output-on-failure --verbose

  # FreeBSD with procfs mounted: additionally exercises
  # readlink(/proc/curproc/file) and readlink(/proc/$PID/file).
  freebsd-proc:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all'
    name: FreeBSD (procfs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test in FreeBSD (with /proc)
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.0'
          usesh: true
          envs: PROGPATH_DEBUG
          copyback: false
          prepare: |
            pkg install -y cmake gmake
            mkdir -p /proc
            mount -t procfs proc /proc
          run: |
            cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_MAKE_PROGRAM=gmake -DPROGPATH_UTF8=${{ env.PROGPATH_UTF8_MODE }}
            cmake --build build
            cd build && ctest --output-on-failure --verbose

  openbsd:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all'
    name: OpenBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test in OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          release: '7.8'
          usesh: true
          envs: PROGPATH_DEBUG
          copyback: false
          prepare: |
            pkg_add cmake gmake
          run: |
            cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_MAKE_PROGRAM=gmake -DPROGPATH_UTF8=${{ env.PROGPATH_UTF8_MODE }}
            cmake --build build
            cd build && ctest --output-on-failure --verbose

  netbsd:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all'
    name: NetBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test in NetBSD
        uses: vmactions/netbsd-vm@v1
        with:
          release: '10.1'
          usesh: true
          envs: PROGPATH_DEBUG
          copyback: false
          prepare: |
            /usr/sbin/pkg_add -u cmake gmake
          run: |
            cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_MAKE_PROGRAM=gmake -DPROGPATH_UTF8=${{ env.PROGPATH_UTF8_MODE }}
            cmake --build build
            cd build && ctest --output-on-failure --verbose

  # DragonFlyBSD runs separately — different pkg manager
  dragonflybsd:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all'
    name: DragonFlyBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test in DragonFlyBSD
        uses: vmactions/dragonflybsd-vm@v1
        with:
          release: '6.4.2'
          usesh: true
          envs: PROGPATH_DEBUG
          copyback: false
          prepare: |
            pkg install -y cmake gmake
          run: |
            cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_MAKE_PROGRAM=gmake -DPROGPATH_UTF8=${{ env.PROGPATH_UTF8_MODE }}
            cmake --build build
            cd build && ctest --output-on-failure --verbose

  # 5. SOLARIS (VM-based)
  solaris-suite:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all'
    name: Oracle Solaris CBE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test in Solaris
        uses: vmactions/solaris-vm@v1
        with:
          release: '11.4-gcc-14'
          usesh: true
          envs: PROGPATH_DEBUG
          copyback: false
          prepare: |
            pkgutil -y -i cmake gmake
          run: |
            cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_MAKE_PROGRAM=gmake -DPROGPATH_UTF8=${{ env.PROGPATH_UTF8_MODE }}
            cmake --build build
            cd build && ctest --output-on-failure --verbose

  # 6. HAIKU — exercises find_path(B_APP_IMAGE_SYMBOL)
  # Uses cross-platform-actions/action which boots a real Haiku VM on
  # an Ubuntu host via QEMU under the hood.
  haiku:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'haiku'
    name: Haiku (r1beta6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Start VM
        uses: cross-platform-actions/action@v1.5.0
        env:
          PROGPATH_DEBUG: ${{ env.PROGPATH_DEBUG }}
        with:
          environment_variables: PROGPATH_DEBUG
          operating_system: haiku
          # beta5's HaikuPorts repository no longer serves its packages.
          version: 'r1beta6'
          shell: bash
      - name: Install CMake
        shell: cpa.sh {0}
        run: pkgman install -y cmake
      - name: Configure
        shell: cpa.sh {0}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DPROGPATH_UTF8=${{ env.PROGPATH_UTF8_MODE }}
      - name: Build
        shell: cpa.sh {0}
        run: cmake --build build
      - name: Test
        shell: cpa.sh {0}
        run: ctest --test-dir build --output-on-failure --verbose

  # 7. MIDNIGHTBSD — FreeBSD-derived, uses mport/pkg.
  midnightbsd:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all'
    name: MidnightBSD (4.0.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Start VM
        uses: cross-platform-actions/action@v1.1.0
        env:
          PROGPATH_DEBUG: ${{ env.PROGPATH_DEBUG }}
        with:
          environment_variables: PROGPATH_DEBUG
          operating_system: midnightbsd
          version: '4.0.4'
          shell: bash
      - name: Install CMake
        shell: cpa.sh {0}
        run: sudo mport install cmake-core || command -v cmake >/dev/null 2>&1
      - name: Install GNU Make
        shell: cpa.sh {0}
        run: sudo mport install gmake || command -v gmake >/dev/null 2>&1
      - name: Verify tools
        shell: cpa.sh {0}
        run: |
          cmake --version
          gmake --version
      - name: Configure
        shell: cpa.sh {0}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_MAKE_PROGRAM=gmake -DPROGPATH_UTF8=${{ env.PROGPATH_UTF8_MODE }}
      - name: Build
        shell: cpa.sh {0}
        run: cmake --build build
      - name: Test
        shell: cpa.sh {0}
        run: ctest --test-dir build --output-on-failure --verbose

  # 8. OMNIOS — illumos/Solaris-family.
  # Exercises getexecname and /proc/self/path/a.out methods.
  omnios:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all'
    name: OmniOS (r151056)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Start VM
        uses: cross-platform-actions/action@v1.1.0
        env:
          PROGPATH_DEBUG: ${{ env.PROGPATH_DEBUG }}
        with:
          environment_variables: PROGPATH_DEBUG
          operating_system: omnios
          version: 'r151056'
          shell: bash
      - name: Install dependencies
        shell: cpa.sh {0}
        run: |
          sudo pkg set-publisher -r -O https://pkg.omnios.org/r151056/extra extra.omnios
          sudo pkg refresh
          sudo pkg install --accept developer/gcc14 developer/build/gnu-make system/header ooce/developer/cmake
      - name: Verify tools
        shell: cpa.sh {0}
        run: |
          gcc --version
          g++ --version
          cmake --version
          gmake --version
      - name: Configure
        shell: cpa.sh {0}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_MAKE_PROGRAM=gmake -DPROGPATH_UTF8=${{ env.PROGPATH_UTF8_MODE }}
      - name: Build
        shell: cpa.sh {0}
        run: cmake --build build
      - name: Test
        shell: cpa.sh {0}
        run: ctest --test-dir build --output-on-failure --verbose

  # 9. GNU/HURD — GNU userspace on a Mach kernel.
  hurd:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'hurd'
    name: GNU/Hurd (2025)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test in GNU/Hurd
        uses: vmactions/hurd-vm@v1.0.2
        with:
          release: '2025'
          arch: x86_64
          # Match the image's uniprocessor kernel and memory configuration.
          cpu: 1
          mem: 4096
          envs: PROGPATH_DEBUG
          copyback: false
          prepare: |
            set -eu
            apt-get update
            apt-get install -y cmake build-essential
          run: |
            set -eu
            cmake -B build -DCMAKE_BUILD_TYPE=Debug -DPROGPATH_UTF8=${{ env.PROGPATH_UTF8_MODE }}
            cmake --build build
            cd build && ctest --output-on-failure --verbose

  # 10. REACTOS — MinGW i386 binaries in a Win32 guest.
  reactos:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'reactos'
    name: ReactOS (0.4.15)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686-win32 g++-mingw-w64-i686-win32
          i686-w64-mingw32-gcc --version
          i686-w64-mingw32-g++ --version
          cmake --version
      - name: Build for ReactOS
        run: |
          # The VM syncs $HOME/work to C:\work, independently of the checkout name.
          cmake -B "$HOME/work/reactos-build" \
            -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=i686 \
            -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++ \
            -DCMAKE_EXE_LINKER_FLAGS=-static -DCMAKE_SHARED_LINKER_FLAGS=-static \
            -DCMAKE_BUILD_TYPE=Debug -DPROGPATH_UTF8=${{ env.PROGPATH_UTF8_MODE }}
          cmake --build "$HOME/work/reactos-build"
          ctest --test-dir "$HOME/work/reactos-build" --output-on-failure -R '^validate_config_symbols$'
          if [ "${{ env.PROGPATH_UTF8_MODE }}" = ON ]; then
            # The pinned guest tar uses ANSI paths; restore Unicode inside ReactOS.
            i686-w64-mingw32-gcc -Wall -Wextra -Werror -static \
              .github/scripts/reactos-utf8.c -o "$HOME/work/reactos-build/restore-reactos-utf8.exe"
            mv "$HOME/work/reactos-build/tests/utf8-测试" "$HOME/work/reactos-build/tests/utf8-staging"
          fi
          find "$HOME/work/reactos-build/tests" -type f -name 'test_*.exe' \
            | wc -l | tr -d '[:space:]' >"$HOME/work/reactos-build/expected-test-count.txt"
          cp .github/scripts/test-reactos.cmd "$HOME/work/reactos-build/"
      - name: Test in ReactOS
        uses: vmactions/reactos-vm@v1.0.5
        with:
          release: '0.4.15'
          arch: i386
          mem: 2048
          sync: tar
          copyback: false
          run: |
            ver
            set "PROGPATH_DEBUG=${{ env.PROGPATH_DEBUG }}"
            call C:\work\reactos-build\test-reactos.cmd C:\work\reactos-build

  # 11. GCC Compile Farm (Remote SSH)
  cfarm:
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'cfarm') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: CFarm (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AIX 7.3
            host: cfarm119.cfarm.net
            # Feature detection alone exceeds the action's default 10m.
            command_timeout: 45m
          - name: AlmaLinux 8.10
            host: cfarm135.cfarm.net
            command_timeout: 10m
          - name: CheriBSD purecap
            host: cfarm240.cfarm.net
            command_timeout: 30m
            # Select CheriABI explicitly so this cannot silently test the hybrid ABI.
            cmake_args: >-
              -DCMAKE_C_COMPILER=cc -DCMAKE_CXX_COMPILER=c++
              -DCMAKE_C_FLAGS=-mabi=purecap -DCMAKE_CXX_FLAGS=-mabi=purecap
              -DCMAKE_MAKE_PROGRAM=gmake
          # Temporarily disabled after host hardware failure; no available CFarm Solaris 10 replacement.
          # - name: Sun Solaris 10
          #   host: cfarm210.cfarm.net
          #   command_timeout: 10m
    steps:
      - uses: actions/checkout@v6
      - name: Load CFarm script
        id: cfarm-script
        run: |
          delimiter=$(uuidgen)
          {
            printf 'script<<%s\n' "$delimiter"
            cat .github/scripts/test-cfarm.sh
            printf '\n%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - name: Run on ${{ matrix.name }} via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROGPATH_DEBUG: ${{ env.PROGPATH_DEBUG }}
          PROGPATH_UTF8_MODE: ${{ env.PROGPATH_UTF8_MODE }}
          CFARM_CMAKE_ARGS: ${{ matrix.cmake_args }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CI_WORKDIR: progpath-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.host }}
        with:
          host: ${{ matrix.host }}
          username: ${{ secrets.CFARM_USERNAME }}
          key: ${{ secrets.CFARM_SSH_KEY }}
          command_timeout: ${{ matrix.command_timeout }}
          envs: PROGPATH_DEBUG,PROGPATH_UTF8_MODE,CFARM_CMAKE_ARGS,REPO,SHA,CI_WORKDIR
          script: ${{ steps.cfarm-script.outputs.script }}

  # 12. REDOX — matching cross compiler and guest.
  redox-suite:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'redox'
    name: Redox (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build and test in Redox
        # Pin the matching compiler and guest supplied by https://github.com/redox-os/redoxer.
        env:
          REDOXER_IMAGE: redoxos/redoxer@sha256:66496e0c5b16425b79c4b2b0c28ffd0b8f7c22567d46eed2e10ef69a011749ae
        run: |
          docker run --rm --device=/dev/kvm \
            --volume "$PWD:/work" --workdir /work \
            --env PROGPATH_DEBUG --env PROGPATH_UTF8_MODE \
            --env REDOXER_USE_FUSE=false "$REDOXER_IMAGE" sh -ec '
              apt-get update -q
              apt-get install -y --no-install-recommends cmake
              redoxer env cmake -B build -DCMAKE_BUILD_TYPE=Debug \
                -DPROGPATH_UTF8="$PROGPATH_UTF8_MODE" \
                -DCMAKE_SYSTEM_NAME=Redox -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
                "-DCMAKE_CROSSCOMPILING_EMULATOR=sh;/work/.github/scripts/redox-exec.sh;/work/build"
              redoxer env cmake --build build
              redoxer exec --output - uname -a
              cd build
              ctest --output-on-failure --verbose
            '
